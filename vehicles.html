<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Registry</title>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/vehicles.css">
</head>
<body>

<div class="app">

    <div id="sidebar-container"></div>

    <main class="main-content">

        <div class="header-row">
            <h1>Vehicle Registry</h1>

            <button id="addVehicleBtn" class="orange-btn">
                + Add Vehicle
            </button>
        </div>

        <div id="vehicleForm" class="vehicle-form hidden">

            <input id="regNo" placeholder="Registration Number">

            <input id="model" placeholder="Vehicle Model">

            <input id="type" placeholder="Vehicle Type">

            <input id="capacity" placeholder="Capacity">

            <select id="status">
                <option>Available</option>
                <option>On Trip</option>
                <option>Maintenance</option>
            </select>

            <button id="saveBtn">Save Vehicle</button>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Registration</th>
                    <th>Model</th>
                    <th>Type</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="vehicleTable"></tbody>

        </table>

    </main>

</div>

<script src="js/sidebar.js"></script>
<script src="js/vehicles.js"></script>

</body>
</html>
