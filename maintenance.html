<main class="main-content">

    <div class="maintenance-grid">

        <div class="maintenance-form-card">

            <h2>Log Service Record</h2>

            <select id="vehicleSelect"></select>

            <input
                id="serviceType"
                placeholder="Service Type"
            >

            <input
                id="cost"
                type="number"
                placeholder="Cost"
            >

            <input
                id="date"
                type="date"
            >

            <select id="status">

                <option value="In Shop">
                    In Shop
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

            <button id="saveBtn">
                Save Record
            </button>

            <div class="rules">

                <p class="available">
                    Available → In Shop
                </p>

                <p class="shop">
                    In Shop → Available
                </p>

                <small>
                    Vehicles in shop are removed
                    from dispatch pool.
                </small>

            </div>

        </div>

        <div class="service-card">

            <h2>Service Log</h2>

            <div id="serviceList"></div>

        </div>

    </div>

</main>
