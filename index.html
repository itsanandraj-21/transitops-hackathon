
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="hero">
    <div class="hero-content">
        <span class="tag">Smart Transport Operations Platform</span>

        <h1>
            Manage Your Fleet <br>
            Smarter with <span>TransitOps</span>
        </h1>

        <p>
            Streamline fleet operations, manage drivers, dispatch trips,
            track maintenance, and monitor expenses from a single dashboard.
        </p>

        <div class="hero-buttons">
            <button class="primary-btn">Launch Dashboard</button>
            <button class="secondary-btn">View Demo</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h2>500+</h2>
                <p>Vehicles Managed</p>
            </div>

            <div class="stat-box">
                <h2>1200+</h2>
                <p>Trips Completed</p>
            </div>

            <div class="stat-box">
                <h2>99.2%</h2>
                <p>Fleet Availability</p>
            </div>
        </div>
    </div>

    <div class="hero-image">
        <img src="assets/dashboard-preview.png" alt="TransitOps Dashboard">
    </div>
</section>
</body>
</html>
