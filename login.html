<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>TransitOps</h1>
        <p>Fleet Management System</p>

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            Login
        </button>

        <p class="switch">

            Don't have an account?

            <a href="signup.html">
                Signup
            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
